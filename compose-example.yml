# garmin-surreal — Garmin Connect fetcher with SurrealDB as the only storage backend.
#
# Secrets (SurrealDB password, optional Garmin login) live in ./.env — copy .env.example.
# First run needs an interactive Garmin login (MFA prompt) so tokens get saved:
#   docker compose run --rm garmin-fetch
# then start it for good:
#   docker compose up -d
#
# Already running SurrealDB elsewhere? Drop the surrealdb service below, put garmin-fetch on
# that server's Docker network and point SURREALDB_URI at it.

services:
  garmin-fetch:
    build: .
    image: garmin-surreal:latest
    container_name: garmin-fetch
    restart: unless-stopped
    stdin_open: true # interactive Garmin login on first run
    tty: true
    env_file:
      - .env
    volumes:
      - ./garminconnect-tokens:/home/appuser/.garminconnect # persistent Garmin tokens — folder must be owned by 1000:1000
      - ./fit-files:/home/appuser/fit_filestore # raw FIT files when KEEP_FIT_FILES=True — folder must be owned by 1000:1000
    depends_on:
      - surrealdb

  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    container_name: surrealdb
    restart: unless-stopped
    user: root
    env_file:
      - .env
    command: start --user ${SURREALDB_ROOT_USER} --pass ${SURREALDB_ROOT_PASS} --bind 0.0.0.0:8000 surrealkv:/data
    expose:
      - "8000"
    volumes:
      - surrealdb-data:/data

volumes:
  surrealdb-data:
