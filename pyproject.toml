[project]
name = "garmin-grafana"
version = "0.3.0"
description = "A Python application to fetch Garmin health data and store it in a SurrealDB database (garmin-surreal fork of garmin-grafana)"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "dotenv==0.9.9",
    "fitparse==1.2.0",
    "garminconnect==0.3.7",
    "pytz==2025.2",
    "surrealdb==2.0.0",
]

[project.scripts]
garmin-fetch = "garmin_grafana:main"